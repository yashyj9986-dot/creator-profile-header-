<!DOCTYPE html>
<html>
<head>
    <title>Creator Profile</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="profile-card">

    <!-- Profile Header -->
    <div class="profile-header">

        <div class="avatar"></div>

        <div class="profile-details">

            <div class="top-section">
                <h2>alex_designer</h2>

                <div class="buttons">
                    <button class="follow">Follow</button>
                    <button class="message">Message</button>
                </div>
            </div>

            <!-- Statistics -->
            <div class="stats">

                <div>
                    <strong>148</strong>
                    <span>Posts</span>
                </div>

                <div>
                    <strong>12.4k</strong>
                    <span>Followers</span>
                </div>

                <div>
                    <strong>420</strong>
                    <span>Following</span>
                </div>

            </div>

            <!-- Bio -->
            <div class="bio">
                <h3>Alex Rivera • UI Engineer</h3>
                <p>Building web design systems and open source widgets.</p>
                <a href="#">portfolio-alex.dev</a>
            </div>

        </div>

    </div>

    <!-- Story Highlights -->
    <div class="highlights">

        <div class="story">
            <div class="circle"></div>
            <span>Design</span>
        </div>

        <div class="story">
            <div class="circle"></div>
            <span>Projects</span>
        </div>

        <div class="story">
            <div class="circle"></div>
            <span>Work</span>
        </div>

        <div class="story">
            <div class="circle"></div>
            <span>Tips</span>
        </div>

    </div>

</div>

</body>
</html>
